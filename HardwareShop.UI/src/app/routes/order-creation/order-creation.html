<mat-card class="order-card">
  <mat-card-header>
    <mat-card-title>Order Creation</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="customer-row">
      <mat-form-field appearance="outline" class="customer-field">
        <mat-label>Customer</mat-label>
        <mat-select [formControl]="orderForm.controls.customer">
          @for (customer of customers; track customer) {
            <mat-option [value]="customer">{{ customer }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="d-flex align-items-center">
      <mat-form-field appearance="outline">
        <mat-label>Product</mat-label>
        <mat-select [formControl]="lineForm.controls.product">
          @for (product of products; track product) {
            <mat-option [value]="product">{{ product }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Unit</mat-label>
        <mat-select [formControl]="lineForm.controls.unit">
          @for (unit of units; track unit) {
            <mat-option [value]="unit">{{ unit }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Quantity</mat-label>
        <input matInput type="number" min="1" [formControl]="lineForm.controls.quantity" />
      </mat-form-field>

      <button matButton="filled" (click)="addLine()">Insert</button>
    </div>

    <div class="table-wrap">
      <table mat-table [dataSource]="lines" class="mat-elevation-z1 w-full">
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef>Product</th>
          <td mat-cell *matCellDef="let line">{{ line.product }}</td>
        </ng-container>

        <ng-container matColumnDef="unit">
          <th mat-header-cell *matHeaderCellDef>Unit</th>
          <td mat-cell *matCellDef="let line">{{ line.unit }}</td>
        </ng-container>

        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef>Quantity</th>
          <td mat-cell *matCellDef="let line">{{ line.quantity }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
